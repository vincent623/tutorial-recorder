<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教程录制器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">Tutorial Recorder</p>
        <h1>教程自动录制</h1>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">等待开始</span>
      </div>
    </header>

    <section class="controls">
      <button id="btnStart" class="btn btn-primary">开始</button>
      <button id="btnPause" class="btn btn-warning" disabled>暂停</button>
      <button id="btnStop" class="btn btn-danger" disabled>停止</button>
      <button id="btnCapture" class="btn btn-secondary" disabled>截图</button>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">截图数量</span>
        <strong class="stat-value" id="screenshotCount">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">录制时长</span>
        <strong class="stat-value" id="recordTime">00:00</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">媒体状态</span>
        <strong class="stat-value" id="mediaStatus">待启动</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>快速设置</h2>
        <button type="button" id="btnOpenSettings" class="mini-btn">完整设置</button>
      </div>

      <div class="grid grid-equal">
        <label class="field">
          <span>画面录制方式</span>
          <select id="captureMode">
            <option value="displayMedia">共享屏幕 / 标签页（推荐）</option>
            <option value="tabCapture">直接录制当前标签页（兼容模式）</option>
          </select>
          <small class="field-hint" id="captureModeHint">开始录制时会弹出共享画面选择，并额外请求麦克风权限。</small>
        </label>

        <label class="field">
          <span>自动截图间隔（秒）</span>
          <input type="number" id="interval" min="1" max="60" value="5">
        </label>
      </div>

      <div class="grid compact-grid">
        <label class="field checkbox-field">
          <span>自动截图</span>
          <input type="checkbox" id="autoScreenshot" checked>
        </label>
      </div>

      <div class="compact-summary">
        <div class="summary-row">
          <span>当前 AI Provider</span>
          <strong id="providerSummary">火山方舟</strong>
        </div>
        <div class="summary-row">
          <span>提示词版本</span>
          <strong id="promptSummary">默认（平衡）</strong>
        </div>
        <div class="summary-row">
          <span>导出目录</span>
          <strong id="outputDirSummary">tutorial-recorder</strong>
        </div>
      </div>
    </section>

    <section class="panel history-panel">
      <div class="panel-head">
        <h2>历史记录</h2>
        <span class="panel-tip">支持查看、编辑、重新导出和删除</span>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty">暂无录制记录</p>
      </div>
    </section>

    <section class="panel detail-panel" id="detailPanel" hidden>
      <div class="panel-head">
        <h2>教程详情</h2>
        <div class="detail-head-actions">
          <button type="button" id="btnAddStepAtStart" class="mini-btn">开头添加</button>
          <button type="button" id="btnCloseDetail" class="mini-btn">关闭</button>
        </div>
      </div>

      <div class="detail-status" id="detailStatus">选择一条历史记录后可查看和编辑教程。</div>

      <div class="detail-content" id="detailContent" hidden>
        <label class="field">
          <span>教程标题</span>
          <input type="text" id="detailTitle" placeholder="教程标题">
        </label>

        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-export-path" id="detailExportPath"></div>

        <div class="detail-steps" id="detailSteps"></div>

        <input type="file" id="detailImageInput" accept="image/*" hidden>

        <div class="detail-actions">
          <button type="button" id="btnSaveDetail" class="btn btn-secondary">保存修改</button>
          <button type="button" id="btnDetailExport" class="btn btn-primary">导出 ZIP</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>快捷键：Ctrl / Command + Shift + S</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
