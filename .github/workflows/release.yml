name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-recorder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Deterministic Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install Chromium for extension E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run validate:e2e

      - name: Run Browser Observation adapter E2E
        run: npm run smoke:browser-observation

      - name: Run multi-window target selection E2E
        run: npm run smoke:target-selection

      - name: Run real action popup fallback E2E
        run: npm run smoke:action-popup-target

      - name: Run occupied debugger compatibility E2E
        run: npm run smoke:debugger-conflict

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutorial-recorder-browser-e2e
          path: |
            output/playwright/report.json
            output/playwright/browser-observation-report.json
            output/playwright/*.png
            output/playwright/downloads/
          if-no-files-found: warn
          retention-days: 30

      - name: Package extension
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutorial-recorder-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  provider-smoke:
    name: DeepSeek Vision Provider Smoke
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Require DeepSeek repository secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Provider smoke requires the DEEPSEEK_API_KEY repository secret."
            exit 1
          fi

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run DeepSeek vision smoke with one retry
        env:
          PW_PROVIDER_PRESET: deepseekOfficial
          PW_API_STYLE: chatCompletions
          PW_API_BASE_URL: https://api.deepseek.com
          PW_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PW_MODEL_ID: deepseek-v4-flash-vision-exp
        run: |
          for attempt in 1 2; do
            if npm run smoke:ai; then
              exit 0
            fi
            echo "Provider smoke attempt ${attempt}/2 failed."
          done
          exit 1

      - name: Run DeepSeek Browser Observation matrix smoke with one retry
        env:
          PW_PROVIDER_PRESET: deepseekOfficial
          PW_API_STYLE: chatCompletions
          PW_API_BASE_URL: https://api.deepseek.com
          PW_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PW_MODEL_ID: deepseek-v4-flash-vision-exp
        run: |
          for attempt in 1 2; do
            if npm run smoke:browser-observation-model; then
              exit 0
            fi
            echo "Browser Observation provider smoke attempt ${attempt}/2 failed."
          done
          exit 1

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutorial-recorder-deepseek-smoke
          path: |
            output/playwright/ai-smoke-report.json
            output/playwright/ai-*.png
            output/playwright/browser-observation-report.json
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish Signed-off Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - provider-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify tag matches package version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Download verified package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tutorial-recorder-extension
          path: dist

      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists; published assets are immutable. Create a new version tag."
            exit 1
          fi
          gh release create "$TAG_NAME" dist/*.zip dist/*.sha256 \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
