name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Check and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install Chromium for extension E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run validate:e2e

      - name: Detect DeepSeek smoke secret
        id: deepseek-secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require DeepSeek secret for trusted CI
        if: steps.deepseek-secret.outputs.available != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::error::Trusted CI requires the DEEPSEEK_API_KEY repository secret."
          exit 1

      - name: Run DeepSeek vision smoke
        if: steps.deepseek-secret.outputs.available == 'true'
        env:
          PW_PROVIDER_PRESET: deepseekOfficial
          PW_API_STYLE: chatCompletions
          PW_API_BASE_URL: https://api.deepseek.com
          PW_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PW_MODEL_ID: deepseek-v4-flash-vision-exp
        run: npm run smoke:ai

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-recorder-browser-e2e
          path: |
            output/playwright/*.json
            output/playwright/*.png
            output/playwright/downloads/
          if-no-files-found: warn

      - name: Package extension
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-recorder-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" dist/*.zip dist/*.sha256 \
              --title "$TAG_NAME" \
              --notes "Automated Tutorial Recorder extension package for $TAG_NAME." \
              --verify-tag
          fi
