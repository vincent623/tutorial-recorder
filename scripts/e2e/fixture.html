<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial Recorder Fixture</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --accent: #1677ff;
      --accent-soft: #e8f1ff;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(22, 119, 255, 0.16), transparent 32%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.15;
    }

    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 18px;
      border-radius: 18px;
      background: var(--accent-soft);
    }

    .metric-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: 24px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 24px rgba(22, 119, 255, 0.24);
    }

    button.secondary {
      background: #eef2ff;
      color: #334155;
      box-shadow: none;
    }

    .timeline {
      display: grid;
      gap: 12px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .timeline li {
      padding: 16px 18px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .timeline strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .sidebar h2,
    .workspace h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--accent);
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .notes {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .note {
      padding: 14px 16px;
      border-radius: 16px;
      background: #fff7ed;
      color: #9a3412;
    }

    .theme-sunset {
      --accent: #ea580c;
      --accent-soft: #fff1e9;
    }

    .theme-forest {
      --accent: #15803d;
      --accent-soft: #eaf8ee;
    }

    .theme-night {
      --accent: #7c3aed;
      --accent-soft: #f2ebff;
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="hero">
      <article class="card">
        <p class="eyebrow">Recorder Fixture</p>
        <h1 id="headline">教程自动录制演示页</h1>
        <p class="lead" id="description">
          这是一个本地验证页面，用来制造足够明显的界面变化，方便确认截图、录音和 PDF 导出是否正常。
        </p>
        <div class="actions">
          <button id="btnPlan">切换到计划面板</button>
          <button id="btnReview" class="secondary">切换到评审面板</button>
          <button id="btnTheme">切换主题</button>
        </div>
      </article>
      <article class="card">
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">当前模式</span>
            <strong id="metricMode">计划中</strong>
          </div>
          <div class="metric">
            <span class="metric-label">主题编号</span>
            <strong id="metricTheme">1</strong>
          </div>
          <div class="metric">
            <span class="metric-label">步骤计数</span>
            <strong id="metricCount">0</strong>
          </div>
          <div class="metric">
            <span class="metric-label">最近动作</span>
            <strong id="metricLast">尚未开始</strong>
          </div>
        </div>
      </article>
    </section>

    <section class="workspace">
      <article class="card">
        <h2>操作时间线</h2>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="statusText">等待演示动作</span>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </article>

      <aside class="card sidebar">
        <h2>附加说明</h2>
        <div class="notes" id="notes">
          <div class="note">点击不同按钮会修改标题、色板和时间线。</div>
          <div class="note">暂停录制后再恢复，可以验证时间轴是否连续。</div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const app = document.getElementById('app');
    const timeline = document.getElementById('timeline');
    const statusText = document.getElementById('statusText');
    const headline = document.getElementById('headline');
    const description = document.getElementById('description');
    const metricMode = document.getElementById('metricMode');
    const metricTheme = document.getElementById('metricTheme');
    const metricCount = document.getElementById('metricCount');
    const metricLast = document.getElementById('metricLast');
    const notes = document.getElementById('notes');

    const themes = ['theme-default', 'theme-sunset', 'theme-forest', 'theme-night'];
    let themeIndex = 0;
    let stepCount = 0;

    function pushStep(title, detail) {
      stepCount += 1;
      metricCount.textContent = String(stepCount);
      metricLast.textContent = title;
      statusText.textContent = title;

      const item = document.createElement('li');
      item.innerHTML = `<strong>步骤 ${stepCount} · ${title}</strong><span>${detail}</span>`;
      timeline.prepend(item);
    }

    document.getElementById('btnPlan').addEventListener('click', () => {
      headline.textContent = '计划面板已展开';
      description.textContent = '左侧时间线已经切换到计划视图，适合验证步骤文案与截图变化。';
      metricMode.textContent = '计划中';
      pushStep('切换到计划面板', '展示了计划说明、步骤统计和更新后的主标题。');
    });

    document.getElementById('btnReview').addEventListener('click', () => {
      headline.textContent = '评审面板已展开';
      description.textContent = '主区域现在强调评审流程，适合验证第二张或第三张截图的差异。';
      metricMode.textContent = '评审中';
      pushStep('切换到评审面板', '替换了主标题和描述文案，并更新当前模式。');

      const extra = document.createElement('div');
      extra.className = 'note';
      extra.textContent = '评审模式会强调差异检查和导出复核。';
      notes.prepend(extra);
    });

    document.getElementById('btnTheme').addEventListener('click', () => {
      app.classList.remove(...themes);
      themeIndex = (themeIndex + 1) % themes.length;
      app.classList.add(themes[themeIndex]);
      metricTheme.textContent = String(themeIndex + 1);
      pushStep('切换主题色板', `当前主题编号已变为 ${themeIndex + 1}，页面强调色同步更新。`);
    });
  </script>
</body>
</html>
